<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kkt crate map</title>
<link rel="stylesheet" href="map.css">
</head>
<body>
<header class="bar">
  <div class="title">
    <h1>kkt crate map</h1>
    <p id="meta" class="muted"></p>
  </div>
  <div class="controls">
    <label class="search">
      <span class="sr">Search crates and items</span>
      <input id="search" type="search" placeholder="Search crates and items (e.g. Identify, Clock)" autocomplete="off">
    </label>
    <fieldset class="mode" aria-label="Which map">
      <label><input type="radio" name="mode" value="current" checked> Current</label>
      <label><input type="radio" name="mode" value="proposed"> Proposed</label>
    </fieldset>
    <div class="filters">
      <fieldset class="toggles" aria-label="Which crates to show">
        <span class="group-title">Crates:</span>
        <span id="kind-filters" class="toggle-set"></span>
        <label title="Packages never released, such as kkt-keymode and kkt-scratch"><input type="checkbox" id="show-dev-crates" checked> Dev-only</label>
      </fieldset>
      <fieldset class="toggles" aria-label="Which layers to show">
        <span class="group-title">Layers:</span>
        <span id="layer-filters" class="toggle-set"></span>
      </fieldset>
      <fieldset class="toggles" aria-label="Which arrows to show">
        <span class="group-title">Arrows:</span>
        <span id="role-filters" class="toggle-set"></span>
        <label title="Cargo's dependencies: what a crate's own code uses"><input type="checkbox" id="show-normal" checked> <span class="key key-normal"></span>Used in code</label>
        <label title="Cargo's dev-dependencies: what only its tests use"><input type="checkbox" id="show-dev"> <span class="key key-dev"></span>Used by tests</label>
        <label title="Cargo's build-dependencies: what its build script uses"><input type="checkbox" id="show-build"> <span class="key key-build"></span>Used by build scripts</label>
      </fieldset>
      <fieldset class="toggles" aria-label="What the panel lists">
        <span class="group-title">Panel:</span>
        <label title="Items that exist only with a crate's real or testing feature"><input type="checkbox" id="show-feature-items" checked> Items behind <code>real</code>/<code>testing</code></label>
      </fieldset>
    </div>
  </div>
</header>
<div id="results" class="results" hidden></div>
<main class="layout">
  <section class="canvas" aria-label="Crate graph">
    <svg id="graph" role="img" aria-labelledby="graph-title">
      <title id="graph-title">The workspace's crates by layer, with arrows from each crate to its dependencies</title>
    </svg>
    <div class="legend key-legend" id="key" aria-label="Key"></div>
    <p class="hint muted">Hover a crate to see its neighbours; click it for details. Arrows point from a crate to what it depends on. Hover an arrow for its roles and what flows along it.</p>
  </section>
  <aside id="panel" class="panel" aria-live="polite"></aside>
</main>
<div id="tip" class="tip" hidden></div>
<dialog id="assembly" class="assembly"></dialog>
<script src="map-data.js"></script>
<script src="proposed-data.js"></script>
<script src="map.js"></script>
</body>
</html>
