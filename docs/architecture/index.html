<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kkt crate map</title>
<link rel="stylesheet" href="map.css">
</head>
<body>
<header class="bar">
  <div class="title">
    <h1>kkt crate map</h1>
    <p id="meta" class="muted"></p>
  </div>
  <div class="controls">
    <label class="search">
      <span class="sr">Search crates and items</span>
      <input id="search" type="search" placeholder="Search crates and items (e.g. Identify, Clock)" autocomplete="off">
    </label>
    <div class="filters">
      <div class="menu" id="crates-menu">
        <button type="button" class="menu-button" id="crates-button" aria-expanded="false" aria-controls="crates-panel">Crates</button>
        <div class="menu-panel" id="crates-panel" role="group" aria-label="Which crates to show" hidden>
          <div class="menu-all"><button type="button" id="crates-all">All</button><button type="button" id="crates-none">None</button></div>
          <span id="kind-filters" class="menu-list"></span>
          <label title="Packages never released, such as kkt-keymode and kkt-scratch"><input type="checkbox" id="show-dev-crates" checked> Dev-only</label>
        </div>
      </div>
      <div class="menu" id="arrows-menu">
        <button type="button" class="menu-button" id="arrows-button" aria-expanded="false" aria-controls="arrows-panel">Arrows</button>
        <div class="menu-panel" id="arrows-panel" role="group" aria-label="Which arrows to show" hidden>
          <div class="menu-all"><button type="button" id="arrows-all">All</button><button type="button" id="arrows-none">None</button></div>
          <span id="role-filters" class="menu-list"></span>
          <label><input type="checkbox" id="show-normal" checked> <span class="key key-normal"></span>Used in code</label>
          <label><input type="checkbox" id="show-dev"> <span class="key key-dev"></span>Used by tests</label>
          <label><input type="checkbox" id="show-build"> <span class="key key-build"></span>Used by build scripts</label>
        </div>
      </div>
      <button type="button" class="reset-view" id="reset-view" title="Every filter, menu and layer as the page starts, and no crate selected">Reset view</button>
    </div>
  </div>
</header>
<div id="results" class="results" hidden></div>
<main class="layout">
  <section class="canvas" aria-label="Crate graph">
    <div class="layers-all" role="group" aria-label="Every layer at once">Layers: <button type="button" id="layers-show" class="linkish-button">Show all</button><span aria-hidden="true">|</span><button type="button" id="layers-hide" class="linkish-button">Hide all</button></div>
    <svg id="graph" role="img" aria-labelledby="graph-title">
      <title id="graph-title">The workspace's crates by layer, with arrows between each crate and its dependencies</title>
    </svg>
    <div class="legend key-legend" id="key" aria-label="Key"></div>
    <p class="hint muted">Click a crate for details. Tick its corner to trace its arrows.</p>
  </section>
  <aside id="panel" class="panel" aria-live="polite"></aside>
</main>
<div id="tip" class="tip" hidden></div>
<dialog id="assembly" class="assembly"></dialog>
<script src="map-data.js"></script>
<script src="map.js"></script>
</body>
</html>
