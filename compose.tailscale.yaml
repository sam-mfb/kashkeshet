# kkt in Docker, served over HTTPS on your tailnet by a Tailscale container.
#   cp .env.example .env     # then fill in the values
#   docker compose -f compose.tailscale.yaml up -d
#   docker compose -f compose.tailscale.yaml exec kkt kkt key show --web  # operator login
#   docker compose -f compose.tailscale.yaml exec kkt kkt key show        # agents only
#   docker compose -f compose.tailscale.yaml exec kkt kkt backup /backups
# kkt and Tailscale are separate containers on the Compose network. Tailscale
# Serve proxies HTTPS 443 to http://kkt:7420 (see tailscale/serve.json), and
# only the Tailscale container is on the tailnet. kkt is also published on
# the host's loopback, for programs on this machine. Either container can be
# restarted alone.

services:
  tailscale:
    image: tailscale/tailscale:stable
    restart: unless-stopped
    # No `hostname:` here. Docker maps a container's own hostname to itself,
    # so a machine name of `kkt` would send Serve's proxy back to this
    # container. Tailscale takes the machine name from TS_HOSTNAME instead.
    environment:
      # Optional. Without a key the container prints a login link in its log.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:?set TS_HOSTNAME in .env}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      # Userspace networking: no /dev/net/tun and no extra capabilities.
      TS_USERSPACE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro

  kkt:
    image: ghcr.io/sam-mfb/kashkeshet:${KKT_VERSION:?set KKT_VERSION in .env}
    restart: unless-stopped
    ports:
      # The host's loopback only. Do not drop the 127.0.0.1.
      - "127.0.0.1:${KKT_PORT:-7420}:7420"
    volumes:
      - kkt-data:/data
      # `docker compose exec kkt kkt backup /backups` writes here.
      - ./backups:/backups
    command:
      - serve
      - --bind
      - 0.0.0.0:7420
      - --allow-any-bind
      # Both keys live in the persistent data volume. web-key is beside access-key.
      - --allow-host
      - ${TS_HOSTNAME}.${TS_TAILNET:?set TS_TAILNET in .env}
      # KKT_ALLOW_HOSTS (comma-separated) adds more, such as
      # host.docker.internal for agents in other containers.
      - --allow-host
      - ${KKT_ALLOW_HOSTS:-localhost}

volumes:
  kkt-data:
  tailscale-state:
