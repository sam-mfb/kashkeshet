[workspace]
# Every package in the workspace, listed by name. `default-members` lists them
# all, so cargo commands with no package flags cover the whole workspace.
members = [".", "crates/kkt-scratch"]
default-members = [".", "crates/kkt-scratch"]
resolver = "3"

# Shared by every package: each takes these with `x.workspace = true`.
# The release number lives here (see docs/releases.md).
[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/sam-mfb/kashkeshet"

# Every third-party dependency, with its version and features. Each package
# names the ones it uses as `x.workspace = true`.
[workspace.dependencies]
askama = "0.16.1"
axum = "0.8.9"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
libc = "0.2.191"
rand = "0.10.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rmcp = { version = "3.7.0", features = ["server", "client", "macros", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
schemars = "1.2.3"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
toml = "1.1.8"
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[package]
name = "kashkeshet"
version.workspace = true
description = "A local MCP chat server where AI agents talk and a human watches in a browser"
license.workspace = true
edition.workspace = true
repository.workspace = true
# The only binary is `kkt`, declared below; nothing is found by file layout.
autobins = false

[[bin]]
name = "kkt"
path = "src/main.rs"

[dependencies]
askama.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
futures.workspace = true
rand.workspace = true
reqwest.workspace = true
rmcp.workspace = true
rusqlite.workspace = true
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
# Reads the tool text files (agent-tools.toml, admin-tools.toml).
toml.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
kkt-scratch = { path = "crates/kkt-scratch" }
tower.workspace = true

# Managed with dist 0.33.1. See docs/releases.md for workflow regeneration.
[workspace.metadata.dist]
cargo-dist-version = "0.33.1"
ci = ["github"]
hosting = ["github"]
force-latest = false
installers = ["shell"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
checksum = "sha256"
unix-archive = ".tar.xz"
install-path = "CARGO_HOME"
# The files packed beside kkt, written out: dist would otherwise also pack
# CHANGELOG.md. Release notes go on the release page instead.
auto-includes = false
include = ["README.md", "LICENSE"]
install-success-msg ="kkt installed. Next: run kkt setup to set up this machine, or kkt upgrade if kkt was already set up here."
github-attestations = true
# Attest installers and checksums as well as native archives.
github-attestations-phase = "host"
github-release = "host"
# The workflow narrows dist's tag filter and checks packaged provenance after
# each native build. See docs/releases.md before regenerating it.
allow-dirty = ["ci"]
dispatch-releases = false
pr-run-mode = "plan"
# No Homebrew publishing until a tap and its publishing credential exist.
# Then add "homebrew" to installers, set tap = "sam-mfb/homebrew-tap",
# and set publish-jobs = ["homebrew"].

[workspace.metadata.dist.github-custom-runners]
global = "ubuntu-24.04"
aarch64-apple-darwin = "macos-15"
x86_64-apple-darwin = "macos-15-intel"
x86_64-unknown-linux-gnu = "ubuntu-24.04"
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"

[workspace.metadata.dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4

[profile.dist]
inherits = "release"
lto = "thin"
