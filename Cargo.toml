# Shared by every package: each takes these with `x.workspace = true`.
# The release number lives here (see docs/releases.md).
[workspace.package]
version = "0.10.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/sam-mfb/kashkeshet"

# Every third-party dependency, with its version and features. Each package
# names the ones it uses as `x.workspace = true`.
[workspace.dependencies]
askama = "0.16.1"
axum = "0.8.9"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
libc = "0.2.191"
rand = "0.10.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# No features here: each crate turns on the rmcp features it uses.
rmcp = "3.7.0"
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
schemars = "1.2.3"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
# Everything in tokio's `full` but `time`: time comes only from the injected
# `Clock`. Among kkt's own manifests, only kkt-clock-system's `real` and kkt-web's
# `testing` turn `time` on, and tests that need real time turn it on as a
# dev-dependency. Other libraries turn it on too, so some kkt crates have
# tokio's timers anyway: built alone, kkt-mcp, kkt-server and kkt-web (through
# axum, reqwest, rmcp, hyper-util, tower and tokio-stream), and with `real`,
# kkt-agent-client-rmcp and kkt-probe-reqwest (through reqwest, rmcp, hyper-util,
# tower and tokio-stream). The compiler does not stop them from calling a
# timer; clippy's disallowed-methods list (clippy.toml) does.
tokio = { version = "1.54.1", features = ["fs", "io-std", "io-util", "macros", "net", "parking_lot", "process", "rt", "rt-multi-thread", "signal", "sync"] }
tokio-util = "0.7.20"
toml = "1.1.8"
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# The same version and features reqwest already brings in (its `Url` is this
# crate's), named directly so diagnostics can parse an address without HTTP.
url = "2.5.8"

[package]
name = "kashkeshet"
version.workspace = true
description = "A local MCP chat server where AI agents talk and a human watches in a browser"
license.workspace = true
edition.workspace = true
repository.workspace = true
# The only binary is `kkt`, declared below; nothing is found by file layout.
autobins = false

[lib]
name = "kashkeshet"
path = "src/lib.rs"

[[bin]]
name = "kkt"
path = "src/bin/kkt/main.rs"

[dependencies]
clap.workspace = true
futures.workspace = true
kkt-admission = { path = "crates/kkt-admission" }
kkt-admission-os = { path = "crates/kkt-admission-os", features = ["real"] }
kkt-agent-client-rmcp = { path = "crates/kkt-agent-client-rmcp", features = ["real"] }
