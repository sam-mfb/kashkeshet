tokio.workspace = true
tracing.workspace = true

# What the unit and integration tests use beyond the program's own
# dependencies, which they also use. `kkt-db-sqlite`'s `testing` gives
# them `MemoryPlace`, a database in memory; `kkt-setup`'s gives them the
# defaults setup's questions accept; every other `kkt-*` crate comes
# with `real` through [dependencies].
[dev-dependencies]
# The client contract, whose `Watched` the register tests read through.
kkt-agent-client = { path = "crates/kkt-agent-client" }
kkt-hash = { path = "crates/kkt-hash" }
kkt-api-admin = { path = "crates/kkt-api-admin" }
kkt-scratch = { path = "crates/kkt-scratch" }
kkt-db-sqlite = { path = "crates/kkt-db-sqlite", features = ["testing"] }
kkt-rules = { path = "crates/kkt-rules", features = ["testing"] }
kkt-setup = { path = "crates/kkt-setup", features = ["testing"] }
reqwest.workspace = true
# The end-to-end tests reach the server with rmcp's client.
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
rusqlite.workspace = true
serde_json.workspace = true
# `time` so the end-to-end tests can bound how long they wait in real time.
tokio = { workspace = true, features = ["time"] }
toml.workspace = true

# Managed with dist 0.33.1. See docs/releases.md for workflow regeneration.
[workspace.metadata.dist]
cargo-dist-version = "0.33.1"
ci = ["github"]
hosting = ["github"]
force-latest = false
installers = ["shell"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
checksum = "sha256"
unix-archive = ".tar.xz"
install-path = "CARGO_HOME"
# The files packed beside kkt, written out: dist would otherwise also pack
# CHANGELOG.md. Release notes go on the release page instead.
auto-includes = false
include = ["README.md", "LICENSE"]
install-success-msg ="kkt installed. Next: run kkt setup to set up this machine, or kkt upgrade if kkt was already set up here."
github-attestations = true
# Attest installers and checksums as well as native archives.
github-attestations-phase = "host"
github-release = "host"
# The workflow narrows dist's tag filter and checks packaged provenance after
# each native build. See docs/releases.md before regenerating it.
allow-dirty = ["ci"]
dispatch-releases = false
pr-run-mode = "plan"
# No Homebrew publishing until a tap and its publishing credential exist.
# Then add "homebrew" to installers, set tap = "sam-mfb/homebrew-tap",
# and set publish-jobs = ["homebrew"].

[workspace.metadata.dist.github-custom-runners]
global = "ubuntu-24.04"
aarch64-apple-darwin = "macos-15"
x86_64-apple-darwin = "macos-15-intel"
x86_64-unknown-linux-gnu = "ubuntu-24.04"
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"

[workspace.metadata.dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4

[profile.dist]
inherits = "release"
lto = "thin"
