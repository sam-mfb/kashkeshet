# kkt in Docker, reachable from this machine only.
#   cp .env.example .env     # then set KKT_VERSION
#   docker compose up -d
#   docker compose exec kkt kkt key show --web  # operator login
#   docker compose exec kkt kkt key show        # agents only
#   docker compose exec kkt kkt backup /backups
# The web page is at http://127.0.0.1:7420/ and MCP at http://127.0.0.1:7420/mcp.
# For access over a tailnet, use compose.tailscale.yaml instead.

services:
  kkt:
    image: ghcr.io/sam-mfb/kashkeshet:${KKT_VERSION:?set KKT_VERSION in .env}
    restart: unless-stopped
    ports:
      # The host's loopback only. Do not drop the 127.0.0.1.
      - "127.0.0.1:${KKT_PORT:-7420}:7420"
    volumes:
      - kkt-data:/data
      # `docker compose exec kkt kkt backup /backups` writes here.
      - ./backups:/backups
    # KKT_ALLOW_HOSTS (comma-separated) adds host names kkt answers to, such
    # as host.docker.internal for agents in other containers. Loopback names
    # are always allowed, so the default changes nothing.
    command:
      - serve
      - --bind
      - 0.0.0.0:7420
      - --allow-any-bind
      # Both keys live in the persistent data volume. web-key is beside access-key.
      - --allow-host
      - ${KKT_ALLOW_HOSTS:-localhost}

volumes:
  kkt-data:
