[package]
name = "kkt-admission"
description = "kkt's admission: whether an HTTP caller is let in at all, and to the web page"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
kkt-entropy = { path = "../kkt-entropy" }
kkt-hash = { path = "../kkt-hash" }
kkt-names = { path = "../kkt-names" }
thiserror.workspace = true

[features]
# `testing::MIN_ACCESS_KEY_BYTES`, the shortest key, for other crates' tests.
testing = []

[dev-dependencies]
kkt-entropy = { path = "../kkt-entropy", features = ["testing"] }
