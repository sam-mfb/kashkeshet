[package]
name = "kkt-mcp-formatter"
description = "The MCP tools' results turned into text or JSON, within the response size cap"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
kkt-api-agent = { path = "../kkt-api-agent" }
kkt-clock = { path = "../kkt-clock" }
kkt-rules = { path = "../kkt-rules" }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
kkt-clock = { path = "../kkt-clock", features = ["testing"] }
kkt-names = { path = "../kkt-names" }
