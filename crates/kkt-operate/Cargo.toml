kkt-container = { path = "../kkt-container" }
kkt-diagnostics = { path = "../kkt-diagnostics" }
kkt-probe = { path = "../kkt-probe" }
kkt-lane-files = { path = "../kkt-lane-files" }
kkt-machine = { path = "../kkt-machine" }
kkt-names = { path = "../kkt-names" }
kkt-provenance = { path = "../kkt-provenance" }
kkt-remote-access = { path = "../kkt-remote-access" }
kkt-rules = { path = "../kkt-rules" }
kkt-service = { path = "../kkt-service" }
