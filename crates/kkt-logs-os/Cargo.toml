[package]
name = "kkt-logs-os"
description = "Writing kkt's log files and starting its tracing subscriber"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
kkt-clock = { path = "../kkt-clock" }
kkt-logs = { path = "../kkt-logs" }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[features]
real = ["dep:tracing", "dep:tracing-subscriber"]

[dev-dependencies]
kkt-clock = { path = "../kkt-clock", features = ["testing"] }
kkt-scratch = { path = "../kkt-scratch" }
tracing.workspace = true
tracing-subscriber.workspace = true
