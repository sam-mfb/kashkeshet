[package]
name = "kkt-db"
description = "kkt's database contract: tables, queries, changes, transactions and migrations, for any database"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Only for `testing`: the in-memory backend matches and draws excerpts as
# every backend does.
kkt-search = { path = "../kkt-search", optional = true }
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
kkt-search = { path = "../kkt-search" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
# `testing`: `testing::MemoryPlace`, a database held in memory that keeps the
# contract, and `testing::conformance`, the checks every backend must pass.
testing = ["dep:kkt-search"]
