[package]
name = "kkt-probe-reqwest"
description = "Probing a kkt server over HTTP with reqwest, and reading its key files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
kkt-probe = { path = "../kkt-probe" }
reqwest = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
# `HttpProber`: key files and HTTP probes; third-party types stay inside.
real = ["dep:reqwest", "dep:serde_json"]
