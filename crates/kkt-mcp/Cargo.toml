[package]
name = "kkt-mcp"
description = "The agent and admin MCP tools, their text, and the endpoints' HTTP transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum.workspace = true
kkt-admission = { path = "../kkt-admission" }
kkt-config = { path = "../kkt-config" }
kkt-mcp-formatter = { path = "../kkt-mcp-formatter" }
kkt-hosts = { path = "../kkt-hosts" }
kkt-identity = { path = "../kkt-identity" }
kkt-names = { path = "../kkt-names" }
kkt-rules = { path = "../kkt-rules" }
kkt-shutdown = { path = "../kkt-shutdown" }
rmcp = { workspace = true, features = ["server", "macros", "transport-streamable-http-server"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
# Key mode, the identity the tests run the surfaces with.
kkt-identity-keymode = { path = "../kkt-identity-keymode" }
kkt-clock = { path = "../kkt-clock", features = ["testing"] }
kkt-db-sqlite = { path = "../kkt-db-sqlite", features = ["testing"] }
kkt-events = { path = "../kkt-events" }
kkt-entropy = { path = "../kkt-entropy", features = ["testing"] }
kkt-store = { path = "../kkt-store", features = ["testing"] }
tower.workspace = true

[build-dependencies]
# Reads the tool text files (agent-tools.toml, admin-tools.toml).
toml.workspace = true
