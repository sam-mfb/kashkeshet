[package]
name = "kkt-store"
description = "kkt's storage: the Reads/Writes contract and its SQLite implementation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
kkt-config = { path = "../kkt-config" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
kkt-scratch = { path = "../kkt-scratch" }

[features]
# `Db::open`, `pending_upgrade` and `copy_database`: they open database files.
real = []
# `testing`: `Db::open_in_memory`, a fresh database held in memory,
# `Db::execute_for_tests`, and `testing::swarms_stay_apart`, the check that
# a store keeps swarms apart.
testing = []
