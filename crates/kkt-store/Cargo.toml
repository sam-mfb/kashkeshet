[package]
name = "kkt-store"
description = "kkt's storage: the Reads/Writes contract and its SQLite implementation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
kkt-db = { path = "../kkt-db" }
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
kkt-db-sqlite = { path = "../kkt-db-sqlite", features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
# `testing`: `testing::swarms_stay_apart`, the check that a store keeps
# swarms apart.
testing = []
