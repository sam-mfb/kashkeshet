[package]
name = "kkt-backup"
description = "kkt's backup folders: writing them and pruning old ones"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
kkt-clock = { path = "../kkt-clock" }
kkt-config = { path = "../kkt-config" }

[dev-dependencies]
kkt-clock = { path = "../kkt-clock", features = ["testing"] }
kkt-scratch = { path = "../kkt-scratch" }

[features]
# `write` and `prune`: they write, copy and remove files.
real = []
