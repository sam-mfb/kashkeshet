[package]
name = "kkt-backup"
description = "kkt's backup layouts, names, privacy and retention choices"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
thiserror.workspace = true
kkt-clock = { path = "../kkt-clock" }

[features]
# `write` and `prune`: writing a backup layout and removing old backups on disk.
real = []

[dev-dependencies]
kkt-clock = { path = "../kkt-clock", features = ["testing"] }
kkt-scratch = { path = "../kkt-scratch" }
