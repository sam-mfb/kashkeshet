[package]
name = "kkt-backup"
description = "kkt's backups, as a contract: layouts, names, privacy and retention choices, and writing and pruning backups"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
thiserror.workspace = true
kkt-clock = { path = "../kkt-clock" }

[features]
# `testing::Memory`, backups in memory, for other crates' tests.
testing = []

[dev-dependencies]
kkt-clock = { path = "../kkt-clock", features = ["testing"] }
