[package]
name = "kkt-containerized-service"
description = "kkt's server installed as a containerized service: its contract, and its implementation over a general Compose project"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
futures.workspace = true
kkt-clock = { path = "../kkt-clock" }
kkt-container = { path = "../kkt-container" }
kkt-keys = { path = "../kkt-keys" }
kkt-machine = { path = "../kkt-machine" }

[features]
# `testing`: `testing::Memory`, installations in memory, with `Run`.
testing = []

[dev-dependencies]
kkt-clock = { path = "../kkt-clock", features = ["testing"] }
kkt-container = { path = "../kkt-container", features = ["testing"] }
kkt-keys = { path = "../kkt-keys", features = ["testing"] }
