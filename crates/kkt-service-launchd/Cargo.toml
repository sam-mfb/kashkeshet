[package]
name = "kkt-service-launchd"
description = "kkt's service as a launchd user agent on macOS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Work the real service manager: its files and commands. What it decides
# is tested without it, over a fake system.
real = []

[dependencies]
kkt-clock = { path = "../kkt-clock" }
kkt-service = { path = "../kkt-service" }

[dev-dependencies]
kkt-clock = { path = "../kkt-clock", features = ["testing"] }
