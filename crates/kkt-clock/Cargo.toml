[package]
name = "kkt-clock"
description = "kkt's clock: the current time, injected so tests can control it, and kkt's time types"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
chrono.workspace = true
futures.workspace = true
kkt-config = { path = "../kkt-config" }
tokio.workspace = true

[features]
# `SystemClock`: the real system clock, with its wall-clock sleep. It turns
# on tokio's `time`, which no other kkt crate does, so only a build that
# chooses the real clock has tokio's timers.
real = ["tokio/time"]
# `testing`: `FixedClock`, a clock that moves only when told to.
testing = []

[dev-dependencies]
# `time` for the unit tests, which test `SystemClock` without `real`.
tokio = { workspace = true, features = ["time"] }
