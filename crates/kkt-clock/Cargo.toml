[package]
name = "kkt-clock"
description = "The current time, injected so tests can control it, and the time types that go with it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
chrono.workspace = true
futures.workspace = true
# Only `FixedClock`, under `testing`, uses it.
tokio = { workspace = true, optional = true }

[features]
# `testing`: `FixedClock`, a clock that moves only when told to.
testing = ["dep:tokio"]

[dev-dependencies]
# `time` for the compile-only checks of disallowed time calls.
tokio = { workspace = true, features = ["time"] }
