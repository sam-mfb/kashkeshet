[package]
name = "kkt-clock"
description = "kkt's clock: the current time, injected so tests can control it, and kkt's time types"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
chrono.workspace = true
futures.workspace = true
tokio.workspace = true

[features]
# `testing`: `FixedClock`, a clock that moves only when told to.
testing = []

[dev-dependencies]
# `time` for the compile-only checks of disallowed time calls.
tokio = { workspace = true, features = ["time"] }
