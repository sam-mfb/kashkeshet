[package]
name = "kkt-agent-client-mcp"
description = "kkt-agent-client over MCP: a client of kkt's server through rmcp and reqwest"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
futures.workspace = true
kkt-agent-client = { path = "../kkt-agent-client" }
# Written out rather than left to the program: rmcp's client transport talks
# TLS through reqwest's `rustls`.
reqwest = { workspace = true, features = ["rustls", "stream"] }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
serde_json.workspace = true
tokio.workspace = true
