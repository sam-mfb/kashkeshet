[package]
name = "kkt-operator-commands"
description = "The operator's commands on this machine's kkt server: keys, lanes and agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
kkt-keys = { path = "../kkt-keys" }
kkt-api-agent = { path = "../kkt-api-agent" }
kkt-api-operator = { path = "../kkt-api-operator" }
kkt-llm-agent-config = { path = "../kkt-llm-agent-config" }
kkt-clock = { path = "../kkt-clock" }
kkt-config-file = { path = "../kkt-config-file" }
kkt-container = { path = "../kkt-container" }
kkt-containerized-service = { path = "../kkt-containerized-service" }
kkt-deployment = { path = "../kkt-deployment" }
kkt-entropy = { path = "../kkt-entropy" }
kkt-lane-files = { path = "../kkt-lane-files" }
kkt-machine = { path = "../kkt-machine" }
kkt-rules = { path = "../kkt-rules" }
kkt-setup = { path = "../kkt-setup" }
tokio.workspace = true

[dev-dependencies]
futures.workspace = true
kkt-containerized-service = { path = "../kkt-containerized-service", features = ["testing"] }
