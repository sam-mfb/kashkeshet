[package]
name = "kkt-service"
description = "Running kkt as a launchd or systemd service of the user's login"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# `testing::Memory`, a service manager in memory for consumers' tests.
testing = []

[dependencies]
kkt-clock = { path = "../kkt-clock" }
kkt-server-keys = { path = "../kkt-server-keys" }
thiserror.workspace = true

[dev-dependencies]
kkt-clock = { path = "../kkt-clock", features = ["testing"] }
