[package]
name = "kkt-names"
description = "kkt's handles, channel IDs and name packs, and the randomness they are drawn from"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
rand = { workspace = true, optional = true }
sha2.workspace = true

[features]
# `OsEntropy`: randomness from the operating system.
real = ["dep:rand"]
# `testing`: the predictable stand-ins `SeqEntropy` and `SameHandleEntropy`.
testing = []
