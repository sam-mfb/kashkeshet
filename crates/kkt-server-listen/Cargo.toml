[package]
name = "kkt-server-listen"
description = "Binding and serving kkt's assembled HTTP server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum.workspace = true
kkt-server = { path = "../kkt-server" }
tokio.workspace = true

[features]
# `listen` and `Listening`: binding and serving the server socket.
real = []

[dev-dependencies]
kkt-log = { path = "../kkt-log", features = ["testing"] }
kkt-admission = { path = "../kkt-admission" }
kkt-clock = { path = "../kkt-clock", features = ["testing"] }
kkt-entropy = { path = "../kkt-entropy", features = ["testing"] }
kkt-events = { path = "../kkt-events" }
kkt-mcp-formatter = { path = "../kkt-mcp-formatter" }
kkt-hosts = { path = "../kkt-hosts" }
kkt-identity-keymode = { path = "../kkt-identity-keymode" }
kkt-mcp = { path = "../kkt-mcp" }
kkt-rules = { path = "../kkt-rules", features = ["testing"] }
kkt-shutdown = { path = "../kkt-shutdown" }
kkt-web = { path = "../kkt-web", features = ["testing"] }
