[package]
name = "kkt-watch"
description = "kkt watch: waiting for one agent's new messages from the shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
thiserror.workspace = true
futures.workspace = true
kkt-agent-client = { path = "../kkt-agent-client" }
kkt-clock = { path = "../kkt-clock" }
tokio.workspace = true

[dev-dependencies]
kkt-clock = { path = "../kkt-clock", features = ["testing"] }
# `time`, for the real-time bound on tests that drive the fake clock.
tokio = { workspace = true, features = ["time"] }
