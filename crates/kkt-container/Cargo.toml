[package]
name = "kkt-container"
description = "kkt in Docker: its Compose files, the folder kkt manages and the commands"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
kkt-clock = { path = "../kkt-clock" }
kkt-config-file = { path = "../kkt-config-file" }
kkt-machine = { path = "../kkt-machine" }
kkt-names = { path = "../kkt-names" }
kkt-settings = { path = "../kkt-settings" }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
kkt-clock = { path = "../kkt-clock", features = ["testing"] }
tokio.workspace = true
