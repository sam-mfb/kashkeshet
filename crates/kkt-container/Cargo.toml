[package]
name = "kkt-container"
description = "kkt in Docker: its Compose files, the folder kkt manages and the commands"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
kkt-clock = { path = "../kkt-clock" }
kkt-config = { path = "../kkt-config" }
kkt-names = { path = "../kkt-names" }
kkt-settings = { path = "../kkt-settings" }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
kkt-clock = { path = "../kkt-clock", features = ["testing"] }
kkt-scratch = { path = "../kkt-scratch" }
tokio.workspace = true

[features]
# `OsHost`: it reads and writes files, runs docker and prints to the terminal.
real = []
