[package]
name = "kkt-web"
description = "The human's pages, over the kkt-api crates' operations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
thiserror.workspace = true
kkt-api-agent = { path = "../kkt-api-agent" }
kkt-api-operator = { path = "../kkt-api-operator" }
kkt-log = { path = "../kkt-log" }
askama.workspace = true
axum.workspace = true
futures.workspace = true
kkt-clock = { path = "../kkt-clock" }
kkt-hash = { path = "../kkt-hash" }
kkt-hosts = { path = "../kkt-hosts" }
kkt-entropy = { path = "../kkt-entropy" }
kkt-names = { path = "../kkt-names" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower = { workspace = true, optional = true }

[features]
# The page scenarios every source must pass, and their helpers
# (`kkt_web::testing`), for the server's tests to run over the rules. The
# live-feed scenarios bound how long they wait in real time, so it turns on
# tokio's `time`.
testing = ["dep:tower", "tokio/time", "kkt-log/testing"]

[dev-dependencies]
kkt-log = { path = "../kkt-log", features = ["testing"] }
# The page tests: a fixed clock, counting and seeded entropy, a stop the
# test owns, and the simulated application, which makes a world for each
# swarm it is asked about.
kkt-api-sim = { path = "../kkt-api-sim", features = ["testing"] }
kkt-clock = { path = "../kkt-clock", features = ["testing"] }
kkt-entropy = { path = "../kkt-entropy", features = ["testing"] }
kkt-shutdown = { path = "../kkt-shutdown" }
# `time` so the live-feed tests can bound how long they wait in real time.
tokio = { workspace = true, features = ["time"] }
tower.workspace = true
