[package]
name = "kkt-web"
description = "The human's pages, through their own contract, and the preview with simulated data"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
askama.workspace = true
axum.workspace = true
futures.workspace = true
kkt-clock = { path = "../kkt-clock" }
kkt-config = { path = "../kkt-config" }
kkt-events = { path = "../kkt-events" }
kkt-hosts = { path = "../kkt-hosts" }
kkt-names = { path = "../kkt-names" }
kkt-shutdown = { path = "../kkt-shutdown" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower = { workspace = true, optional = true }
tracing.workspace = true

[features]
# The page scenarios every source must pass, and their helpers
# (`kkt_web::testing`), for the server's tests to run over the rules.
testing = ["dep:tower"]

[dev-dependencies]
# `testing` is for the page tests: a fixed clock and counting entropy.
# `real` (the system clock, entropy and stop signals), clap and
# tracing-subscriber are for the preview example only, which is a program.
# Cargo gives the unit tests the same list; they must not use `real`.
clap.workspace = true
kkt-clock = { path = "../kkt-clock", features = ["testing", "real"] }
kkt-names = { path = "../kkt-names", features = ["testing", "real"] }
kkt-shutdown = { path = "../kkt-shutdown", features = ["real"] }
tower.workspace = true
tracing-subscriber.workspace = true
