[package]
name = "kkt-probe"
description = "Probing a kkt server and reading its key files, and the HTTP prober that does it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
reqwest = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
# `testing::Memory`, key files and probe answers in memory for consumers' tests.
testing = []
# `HttpProber`: key files and HTTP probes; reqwest's types stay inside.
real = ["dep:reqwest", "dep:serde_json"]
