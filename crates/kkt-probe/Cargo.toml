[package]
name = "kkt-probe"
description = "Probing a kkt server over HTTP and reading its key files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
reqwest = { workspace = true, optional = true }
