[package]
name = "kkt-agent-client-rmcp"
description = "kkt-agent-client's contract over MCP, through rmcp and reqwest"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
futures.workspace = true
kkt-agent-client = { path = "../kkt-agent-client" }
kkt-clock = { path = "../kkt-clock" }
# Written out rather than left to the program: rmcp's client transport talks
# TLS through reqwest's `rustls` (reorganization plan, risk 4).
reqwest = { workspace = true, optional = true, features = ["rustls", "stream"] }
rmcp = { workspace = true, optional = true, features = ["client", "transport-streamable-http-client-reqwest"] }
serde_json.workspace = true
tokio.workspace = true

[features]
# `Mcp`, `Client`, `Remote`, `AdminRemote` and `Http`: they reach the server
# over HTTP.
real = ["dep:reqwest", "dep:rmcp"]
