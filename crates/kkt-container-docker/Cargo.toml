[package]
name = "kkt-container-docker"
description = "kkt-container over Docker and Compose"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Run the real `docker` commands and touch the real files. What they do is
# tested without it, over a private runner and a fake host.
real = ["dep:kkt-config-file", "dep:kkt-machine", "dep:serde_json", "dep:thiserror"]

[dependencies]
futures.workspace = true
kkt-clock = { path = "../kkt-clock" }
kkt-container = { path = "../kkt-container" }
kkt-names = { path = "../kkt-names" }
kkt-config-file = { path = "../kkt-config-file", optional = true }
kkt-machine = { path = "../kkt-machine", optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
kkt-clock = { path = "../kkt-clock", features = ["testing"] }
kkt-config-file = { path = "../kkt-config-file" }
kkt-machine = { path = "../kkt-machine" }
kkt-scratch = { path = "../kkt-scratch" }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
