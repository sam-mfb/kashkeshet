[package]
name = "kkt-container-docker"
description = "kkt-container's Projects over Docker Compose"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
kkt-container = { path = "../kkt-container" }
serde_json.workspace = true
# Only the `testing` host keeps time, on a fixed clock.
kkt-clock = { path = "../kkt-clock", optional = true }

[features]
# `testing`: `testing::Scripted`, a scripted host that keeps a transcript,
# and `Docker::scripted`, which builds a Docker over one.
testing = ["dep:kkt-clock", "kkt-clock/testing"]

[dev-dependencies]
kkt-scratch = { path = "../kkt-scratch" }
