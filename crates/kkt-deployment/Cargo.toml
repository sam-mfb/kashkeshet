[package]
name = "kkt-deployment"
description = "What follows from how kkt is deployed on this machine: its places and key files, whether kkt serve may run, and what kkt status and kkt upgrade do"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
kkt-bare-service = { path = "../kkt-bare-service" }
kkt-containerized-service = { path = "../kkt-containerized-service" }
kkt-entropy = { path = "../kkt-entropy" }
kkt-keys = { path = "../kkt-keys" }
kkt-machine = { path = "../kkt-machine" }
semver.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
kkt-entropy = { path = "../kkt-entropy", features = ["testing"] }
# Key files in memory and admin names, for the admin-name lines' pins.
kkt-keys = { path = "../kkt-keys", features = ["testing"] }
kkt-names = { path = "../kkt-names" }
