[package]
name = "kkt-server"
description = "Assembling the server from its parts and adapting to the web contract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum.workspace = true
futures.workspace = true
kkt-admission = { path = "../kkt-admission" }
kkt-api-agent = { path = "../kkt-api-agent" }
kkt-api-operator = { path = "../kkt-api-operator" }
kkt-clock = { path = "../kkt-clock" }
kkt-log = { path = "../kkt-log" }
kkt-mcp-formatter = { path = "../kkt-mcp-formatter" }
kkt-hosts = { path = "../kkt-hosts" }
kkt-identity = { path = "../kkt-identity" }
kkt-mcp = { path = "../kkt-mcp" }
kkt-entropy = { path = "../kkt-entropy" }
kkt-names = { path = "../kkt-names" }
kkt-provenance = { path = "../kkt-provenance" }
kkt-rules = { path = "../kkt-rules" }
kkt-shutdown = { path = "../kkt-shutdown" }
kkt-web = { path = "../kkt-web" }

[dev-dependencies]
# The rules the tests build take an events bus.
kkt-events = { path = "../kkt-events" }
kkt-log = { path = "../kkt-log", features = ["testing"] }
# The simulated application and its gate, for the page served alone.
kkt-api-sim = { path = "../kkt-api-sim", features = ["testing"] }
# Key mode, the identity the tests run the surfaces with.
kkt-identity-keymode = { path = "../kkt-identity-keymode" }
# The page scenarios (`kkt_web::testing`), run over the rules; a fixed clock,
# counting entropy and an in-memory database for them.
kkt-clock = { path = "../kkt-clock", features = ["testing"] }
kkt-entropy = { path = "../kkt-entropy", features = ["testing"] }
kkt-rules = { path = "../kkt-rules", features = ["testing"] }
kkt-web = { path = "../kkt-web", features = ["testing"] }
serde_json.workspace = true
tokio.workspace = true
tower.workspace = true
