[package]
name = "kkt-setup"
description = "The setup record of how this machine is set up, and the conversation that produces it: kkt setup, kkt switch and adopting an unrecorded server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
kkt-keys = { path = "../kkt-keys" }
kkt-llm-agent-config = { path = "../kkt-llm-agent-config" }
kkt-names = { path = "../kkt-names" }
serde.workspace = true
kkt-toml = { path = "../kkt-toml" }

[features]
# `testing::DEFAULT_SETUP_URL` and `DEFAULT_SETUP_KEY`, the defaults Enter
# accepts for a client, for other crates' tests.
testing = []
