[package]
name = "kkt-setup"
description = "kkt setup: the setup record and the steps of setup, switch and upgrade"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
kkt-server-keys = { path = "../kkt-server-keys" }
kkt-client-config = { path = "../kkt-client-config" }
kkt-container = { path = "../kkt-container" }
kkt-machine = { path = "../kkt-machine" }
kkt-hash = { path = "../kkt-hash" }
kkt-names = { path = "../kkt-names" }
semver.workspace = true
serde.workspace = true
