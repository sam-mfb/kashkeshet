[package]
name = "kkt-agent-client"
description = "kkt's MCP client, for avatar commands and kkt watch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
futures.workspace = true
kkt-clock = { path = "../kkt-clock" }
kkt-config = { path = "../kkt-config" }
kkt-watch = { path = "../kkt-watch" }
# Written out rather than left to the program: rmcp's client transport talks
# TLS through reqwest's `rustls` (reorganization plan, risk 4).
reqwest = { workspace = true, optional = true, features = ["rustls"] }
rmcp = { workspace = true, optional = true, features = ["client", "transport-streamable-http-client-reqwest"] }
serde_json.workspace = true
tokio.workspace = true

[features]
# `Client`, `Remote` and `AdminRemote` (with watching.rs): they reach the
# server over HTTP.
real = ["dep:reqwest", "dep:rmcp"]
