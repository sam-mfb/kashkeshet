[package]
name = "kkt-bare-service-systemd"
description = "Running kkt's server directly on the machine as a systemd user unit on Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
kkt-clock = { path = "../kkt-clock" }
