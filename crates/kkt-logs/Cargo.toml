[package]
name = "kkt-logs"
description = "kkt's log levels, policy checks, rollover and age-pruning rules, and the log file"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
kkt-clock = { path = "../kkt-clock" }
thiserror.workspace = true

[features]
# The log file on disk: `RotatingFile` and `open_log_file`.
real = []

[dev-dependencies]
kkt-clock = { path = "../kkt-clock", features = ["testing"] }
kkt-scratch = { path = "../kkt-scratch" }
