[package]
name = "kkt-keymode"
description = "A second program that assembles kkt's key mode from the shared crates; for development only, never released"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "kkt-keymode"
path = "src/main.rs"

# Never in a release: dist builds only the `kkt` program, and
# .github/scripts/check-release-packages.sh checks no release depends on it.
[package.metadata.dist]
dist = false

[package.metadata.kkt]
dev-only = true

[dependencies]
kkt-backup = { path = "../../crates/kkt-backup" }
kkt-listen = { path = "../../crates/kkt-listen" }
kkt-log-tracing = { path = "../../crates/kkt-log-tracing" }
kkt-admission = { path = "../../crates/kkt-admission" }
kkt-api-agent = { path = "../../crates/kkt-api-agent" }
kkt-keys = { path = "../../crates/kkt-keys" }
kkt-keys-os = { path = "../../crates/kkt-keys-os" }
kkt-clock = { path = "../../crates/kkt-clock" }
kkt-clock-system = { path = "../../crates/kkt-clock-system" }
kkt-config-file = { path = "../../crates/kkt-config-file" }
kkt-db-sqlite = { path = "../../crates/kkt-db-sqlite" }
kkt-entropy-os = { path = "../../crates/kkt-entropy-os" }
kkt-files = { path = "../../crates/kkt-files" }
kkt-hosts = { path = "../../crates/kkt-hosts" }
kkt-identity-keymode = { path = "../../crates/kkt-identity-keymode" }
kkt-mcp = { path = "../../crates/kkt-mcp" }
kkt-names = { path = "../../crates/kkt-names" }
kkt-provenance = { path = "../../crates/kkt-provenance" }
kkt-rules = { path = "../../crates/kkt-rules" }
kkt-server = { path = "../../crates/kkt-server" }
kkt-shutdown = { path = "../../crates/kkt-shutdown" }
kkt-shutdown-os = { path = "../../crates/kkt-shutdown-os" }
kkt-web = { path = "../../crates/kkt-web" }
kkt-terminal = { path = "../../crates/kkt-terminal" }
tokio.workspace = true
