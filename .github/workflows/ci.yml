name: CI

on:
  pull_request:
    branches: [next, main]
  push:
    branches: [next, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        # The rustup proxy installs the toolchain and components from rust-toolchain.toml.
        run: rustc --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build tests
        run: cargo test --locked --no-run

      # Tests keep their scratch files under target/ (tests/common/scratch.rs).
      # Here the system temporary folder is one they may not write to, so a
      # test that writes there fails. Doc tests run on their own below:
      # rustdoc itself needs a temporary folder to compile them.
      - name: Tests, with the system temporary folder closed to them
        run: |
          mkdir -p target/no-tmp
          chmod 555 target/no-tmp
          TMPDIR="$PWD/target/no-tmp" cargo test --locked --lib --bins --tests

      - name: Doc tests
        run: cargo test --locked --doc
