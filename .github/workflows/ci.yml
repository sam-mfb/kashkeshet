name: CI

on:
  pull_request:
    branches: [next, main, refactor]
  push:
    branches: [next, main, refactor]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is temporarily off: GitHub has too little macOS runner
        # capacity. It should come back: add it to this list again.
        os: [ubuntu-24.04]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        # The rustup proxy installs the toolchain and components from rust-toolchain.toml.
        run: rustc --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The release scripts' own tests, also run by release.yml at tag time,
      # and the tests of check-crates.sh's rules.
      - name: Release and workspace script tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      # The third-party packages and features built into the programs match
      # the list kept in .github/third-party-features.txt. A pull request
      # that means to change them updates the list and says so. The script
      # covers every target platform, so its output is the same on each, and
      # one runner is enough.
      - name: Third-party feature list
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: >-
          LC_ALL=C bash .github/scripts/third-party-features.sh
          | bash .github/scripts/check-third-party-features.sh .github/third-party-features.txt

      # No dev-only package (kkt-scratch, kkt-keymode) is part of a
      # released program. The script covers every target platform, so one
      # runner is enough.
      - name: No dev-only package in a release
        if: matrix.os == 'ubuntu-24.04'
        run: bash .github/scripts/check-release-packages.sh

      # Each package builds alone and with each of its features, and the
      # manifests follow the rules for `real` and `testing`.
      - name: Check each crate
        run: bash .github/scripts/check-crates.sh

      - name: Build tests
        run: cargo test --workspace --locked --no-run

      # Tests keep their scratch files under target/ (crates/kkt-scratch).
      # Here the system temporary folder is one they may not write to, so a
      # test that writes there fails. Doc tests run on their own below:
      # rustdoc itself needs a temporary folder to compile them.
      - name: Tests, with the system temporary folder closed to them
        run: |
          mkdir -p target/no-tmp
          chmod 555 target/no-tmp
          TMPDIR="$PWD/target/no-tmp" cargo test --workspace --locked --lib --bins --tests

      # The HTTP-only end-to-end tests again, against each program run as a
      # process of its own: `kkt serve` and the second program, kkt-keymode,
      # which assembles key mode from the same crates (tests/common).
      - name: End-to-end tests against kkt and kkt-keymode
        run: |
          cargo build --locked -p kkt-keymode
          for program in kkt kkt-keymode; do
            echo "End-to-end tests against $program"
            KKT_TEST_PROGRAM=$program TMPDIR="$PWD/target/no-tmp" cargo test --locked \
              --test e2e --test admission --test web_login --test admin --test watch \
              --test latency
          done

      - name: Doc tests
        run: cargo test --workspace --locked --doc

  # kkt-pro will depend on the shared crates by git. A crate outside the
  # workspace, depending that way on kkt-api-agent, kkt-rules, kkt-server and
  # kkt-server-listen at this commit, must build. Cargo fetches the commit from this repository, so a
  # pull request from a fork, whose commit is not on one of its branches, may
  # not be found here.
  outside-crate:
    name: A crate outside the workspace builds against the shared crates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustc --version

      - name: Build a crate outside the workspace by git
        env:
          REPOSITORY: https://github.com/${{ github.repository }}
          REV: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/build-outside-crate.sh "$REPOSITORY" "$REV" "$RUNNER_TEMP/outside-kkt"

  # Only for a pull request into main, such as a release's: there the crate
  # map in docs/architecture must be current. Pull requests into next and
  # pushes do not run it, so a change to public items there does not wait
  # on the map; regenerate it on next before the release.
  crate-map:
    name: The crate map in docs/architecture is current
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustc --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Rebuilds the map's data from cargo metadata, rustdoc's JSON and the
      # sources, and fails if docs/architecture/map-data.js differs in
      # anything but the commit it names.
      - name: Regenerate the crate map and compare
        run: python3 docs/architecture/generate.py --check
